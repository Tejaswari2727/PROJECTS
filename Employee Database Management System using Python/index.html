<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Management System</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .form-container { max-width: 600px; background: #fff; padding: 20px; margin: 20px auto; border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .form-container label { display: block; margin-top: 10px; font-weight: bold; }
    .form-container input { width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .form-container button { margin-top: 15px; padding: 10px 20px; border: none; border-radius: 4px;
      background-color: #007bff; color: white; font-weight: bold; cursor: pointer; }
    .form-container button:hover { background-color: #0056b3; }
    table { width: 90%; margin: 20px auto; border-collapse: collapse; background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    table th, table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    table th { background-color: #007bff; color: white; }
    .action-btn { padding: 6px 12px; margin: 2px; border: none; border-radius: 4px; cursor: pointer; }
    .update-btn { background-color: #28a745; color: white; }
    .delete-btn { background-color: #dc3545; color: white; }
    .update-btn:hover { background-color: #218838; }
    .delete-btn:hover { background-color: #c82333; }
  </style>
</head>
<body>
  <h1>Employee Management System</h1>

  <div class="form-container">
    <form id="employeeForm">
      <label for="ename">Name</label>
      <input type="text" id="ename" name="ename" placeholder="Enter Name" required>
      <label for="salary">Salary</label>
      <input type="number" id="salary" name="salary" placeholder="Enter Salary" required>
      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Enter Location" required>
      <label for="dept">Department</label>
      <input type="text" id="dept" name="dept" placeholder="Enter Department" required>
      <button type="submit">Add Employee</button>
    </form>
  </div>

  <div style="text-align:center; margin-bottom:20px;">
    <button onclick="getEmployeeById()" class="action-btn update-btn">Search by ID</button>
    <button onclick="getEmployeeByName()" class="action-btn update-btn">Search by Name</button>
    <button onclick="filterByDepartment()" class="action-btn update-btn">Filter by Department</button>
    <button onclick="filterByLocation()" class="action-btn update-btn">Filter by Location</button>
    <button onclick="filterBySalary()" class="action-btn update-btn">Filter by Salary</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Emp ID</th><th>Name</th><th>Salary</th><th>Location</th><th>Department</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="employeeTableBody"></tbody>
  </table>

  <script>
    const API_URL = "http://localhost:8000";

    async function loadEmployees() {
      const res = await fetch(`${API_URL}/employees`);
      const data = await res.json();
      renderFiltered(data);
    }

    // Add Employee
    document.getElementById("employeeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch(`${API_URL}/employees`, {
        method: "POST",
        body: new URLSearchParams(formData)
      });
      const data = await res.json();
      alert(data.status);
      loadEmployees();
      e.target.reset();
    });

    // Delete Employee
    async function deleteEmployee(id) {
      if (!confirm("Are you sure you want to delete this employee?")) return;
      const res = await fetch(`${API_URL}/employees/${id}`, { method: "DELETE" });
      const data = await res.json();
      alert(data.status);
      loadEmployees();
    }

    // Update Employee
    async function updateEmployee(id, current) {
      const ename = prompt("Enter new name:", current[1]);
      const salary = prompt("Enter new salary:", current[2]);
      const location = prompt("Enter new location:", current[3]);
      const dept = prompt("Enter new department:", current[4]);
      if (!ename || !salary || !location || !dept) { alert("All fields are required!"); return; }
      const res = await fetch(`${API_URL}/employees/${id}`, {
        method: "PUT",
        body: new URLSearchParams({ ename, salary, location, dept })
      });
      const data = await res.json();
      alert(data.status);
      loadEmployees();
    }

    // Search by ID
    async function getEmployeeById() {
      const empid = prompt("Enter Employee ID:");
      if (!empid) return;
      const res = await fetch(`${API_URL}/employees/id/${empid}`);
      const emp = await res.json();
      if (!emp) { alert("No record found"); return; }
      alert(`Employee:\nID: ${emp[0]}\nName: ${emp[1]}\nSalary: ${emp[2]}\nLocation: ${emp[3]}\nDept: ${emp[4]}`);
    }

    // Search by Name
    async function getEmployeeByName() {
      const name = prompt("Enter Employee Name:");
      if (!name) return;
      const res = await fetch(`${API_URL}/employees/name/${name}`);
      const emp = await res.json();
      if (!emp) { alert("No record found"); return; }
      alert(`Employee:\nID: ${emp[0]}\nName: ${emp[1]}\nSalary: ${emp[2]}\nLocation: ${emp[3]}\nDept: ${emp[4]}`);
    }

    // Filters
    async function filterByDepartment() {
      const dept = prompt("Enter Department:");
      if (!dept) return;
      const res = await fetch(`${API_URL}/employees/department/${dept}`);
      const data = await res.json();
      renderFiltered(data);
    }

    async function filterByLocation() {
      const loc = prompt("Enter Location:");
      if (!loc) return;
      const res = await fetch(`${API_URL}/employees/location/${loc}`);
      const data = await res.json();
      renderFiltered(data);
    }

    async function filterBySalary() {
      const sal = prompt("Enter Minimum Salary:");
      if (!sal) return;
      const res = await fetch(`${API_URL}/employees/salary/${sal}`);
      const data = await res.json();
      renderFiltered(data);
    }

    // Helper to render table
    function renderFiltered(data) {
      const tbody = document.getElementById("employeeTableBody");
      tbody.innerHTML = "";
      if (!data || data.length === 0) {
        alert("No records found!");
        return;
      }
      data.forEach(emp => {
        const row = `<tr>
          <td>${emp[0]}</td><td>${emp[1]}</td><td>${emp[2]}</td><td>${emp[3]}</td><td>${emp[4]}</td>
          <td>
            <button onclick='updateEmployee(${emp[0]}, ${JSON.stringify(emp)})' class="action-btn update-btn">Update</button>
            <button onclick="deleteEmployee(${emp[0]})" class="action-btn delete-btn">Delete</button>
          </td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    loadEmployees();
  </script>
</body>
</html>
